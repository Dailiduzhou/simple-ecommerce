            tags:
                - Payment
            summary: 支付渠道异步回调
            description: |-
                支付宝/微信等渠道服务器直接调用的异步通知入口，不使用 Bearer 令牌，按 provider 校验签名后更新支付单状态。

                请求体是渠道原始报文（支付宝为 application/x-www-form-urlencoded，微信为 JSON 或 XML），服务端原样交给渠道适配器解析。
                响应体是渠道约定的确认串，必须原样回给渠道，否则渠道会重试：支付宝为 success / fail，微信为 <xml><return_code><![CDATA[SUCCESS]]></return_code></xml>。
                未注册的 provider 返回 400 unsupported provider（text/plain）。
            operationId: Payment_NotifyCallback
            parameters:
                - name: provider
                  in: path
                  required: true
                  description: 渠道标识，与支付适配器注册名一致（本仓库为 alipay、wechat）
                  schema:
                    type: string
                    example: wechat
            requestBody:
                required: true
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            additionalProperties:
                                type: string
                    application/json:
                        schema:
                            type: object
                            description: 渠道原始报文，字段随渠道不同
                            additionalProperties: true
            responses:
                "200":
                    description: 渠道确认串：支付宝 success/fail，微信返回码 XML
                    content:
                        text/plain:
                            schema:
                                type: string
                                example: success
                        application/xml:
                            schema:
                                type: string
                "400":
                    description: provider 未注册或回调被判为无效渠道
                    content:
                        text/plain:
                            schema:
                                type: string
                                example: unsupported provider
                "500":
                    description: 服务内部错误（panic 由 recovery 中间件转成统一错误体）
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/errors.Status'
            security: []
