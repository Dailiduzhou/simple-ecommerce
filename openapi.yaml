components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: '访问令牌（HS256 JWT），登录/刷新接口返回，通过 Authorization: Bearer <token> 传递'
    schemas:
        api.community.v1.Author:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                nickname:
                    type: string
        api.community.v1.Comment:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                postId:
                    type: string
                    format: int64
                author:
                    $ref: '#/components/schemas/api.community.v1.Author'
                content:
                    type: string
                rootCommentId:
                    type: string
                    format: int64
                replyToCommentId:
                    type: string
                    format: int64
                deleted:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                replyCount:
                    type: string
                    format: int64
                replyToDeleted:
                    type: boolean
                replyToAuthor:
                    $ref: '#/components/schemas/api.community.v1.Author'
        api.community.v1.CreateCommentRequest:
            type: object
            properties:
                postId:
                    type: string
                    format: int64
                    x-exclusiveMinimum: 0
                content:
                    type: string
                    minLength: 1
                    maxLength: 16384
                replyToCommentId:
                    type: string
                    format: int64
                    x-minimum: 0
            required:
                - content
        api.community.v1.CreatePostRequest:
            type: object
            properties:
                title:
                    type: string
                    minLength: 1
                    maxLength: 16384
                content:
                    type: string
                    minLength: 1
                    maxLength: 16384
                imageIds:
                    type: array
                    items:
                        type: string
                        format: int64
                        x-exclusiveMinimum: 0
                    description: Optional ordered image IDs (0-9). Omitted or empty means a text-only post.
                    maxItems: 9
                    uniqueItems: true
            description: |-
                Text is trimmed before domain limits (title 100, body 5000 Unicode
                 characters). Images are optional; a post can contain 0-9 images.
            required:
                - title
                - content
        api.community.v1.EmptyReply:
            type: object
            properties: {}
        api.community.v1.Image:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                url:
                    type: string
                contentType:
                    type: string
                sizeBytes:
                    type: string
                    format: int64
                width:
                    type: integer
                    format: int32
                height:
                    type: integer
                    format: int32
        api.community.v1.ListCommentsReply:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.community.v1.Comment'
                nextCursor:
                    type: string
        api.community.v1.ListPostsReply:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.community.v1.Post'
                nextCursor:
                    type: string
        api.community.v1.Post:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                author:
                    $ref: '#/components/schemas/api.community.v1.Author'
                title:
                    type: string
                content:
                    type: string
                images:
                    type: array
