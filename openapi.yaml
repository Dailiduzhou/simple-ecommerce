tags:
    - name: Community
      description: 图文帖子、点赞与评论（含一层楼中楼）
    - name: Mall
      description: 分类、商品、限时活动与今日养生卡片（写操作需要管理员角色）
    - name: Media
      description: 图片上传（预签名直传）与资源查询
    - name: Order
      description: 下单、订单查询与取消
    - name: Payment
      description: 支付单、渠道查询/关单/退款、对账任务与支付渠道异步回调
    - name: User
      description: 注册登录、令牌轮转、用户资料、收货地址与商品浏览记录
