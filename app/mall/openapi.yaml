        api.payment.v1.CreatePaymentReply:
            type: object
            properties:
                actionType:
                    type: string
                payload:
                    type: string
            description: |-
                统一创建支付响应。
                 - action_type: 告诉前端该怎么处理 payload。
                     * "form"     — 提交表单。
                     * "redirect" — 跳转链接。
                     * "invoke"   — 调用客户端支付 SDK/API。
                 - payload: 渠道真实的支付参数,序列化为 JSON 字符串,字段契约见 service 注释。
        api.payment.v1.CreatePaymentReq:
            type: object
            properties:
                orderNo:
                    type: string
                method:
                    type: string
                clientIp:
                    type: string
                extraParams:
                    type: object
                    additionalProperties:
                        type: string
                description:
                    type: string
                totalAmount:
                    type: integer
                    format: int32
            description: |-
                统一创建支付请求。
                 - order_no: 商户订单号(对应 orders.out_trade_no)。
                 - method: provider-neutral 的 "provider:product"，例如 "alipay:wap"。
                 - client_ip: 客户端 IP,微信风控必传。
                 - extra_params: 渠道特有的扩展参数抹平字段:
                     * WECHAT_JSAPI 必须传 "openid"。
                     * ALIPAY_WAP 可传 "return_url"。
                 - description: 可选;省略时服务端从订单号生成安全描述。
                 - total_amount: 已废弃且服务端忽略，金额只从订单读取。
