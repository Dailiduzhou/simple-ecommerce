syntax = "proto3";
package kratos.api;

import "google/protobuf/duration.proto";

option go_package = "github.com/Dailiduzhou/simple-ecommerce/app/mall/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  Snowflake snowflake = 4;
  Payment payment = 5;
  Community community = 6;
  Storage storage = 7;
}

message Snowflake {
  int32 node_id = 1;
}

message Auth {
  string access_token_secret = 1;
  google.protobuf.Duration access_token_timeout = 2;
  string refresh_token_secret = 3;
  google.protobuf.Duration refresh_token_timeout = 4;
  string phone_secret = 5;
  // Per-minute budget for anonymous login/register/refresh requests. Zero means the default.
  int32 auth_requests_per_minute = 6;
  // Failed-login attempts before an account is temporarily locked. Zero means the default.
  int32 login_max_attempts = 7;
  // How long a login lockout lasts from the first recorded failure.
  google.protobuf.Duration login_lockout_duration = 8;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
    // CIDRs of reverse proxies whose X-Forwarded-For may be trusted. Empty
    // means no proxy is trusted and the transport peer address is used.
    repeated string trusted_proxies = 4;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    google.protobuf.Duration dial_timeout = 5;
  }
  Database database = 1;
  Redis redis = 2;
}

message Payment {
  Alipay alipay = 1;
  Wechat wechat = 2;
  CheckPayJob check_pay_job = 3;
  google.protobuf.Duration order_payment_timeout = 4;
  google.protobuf.Duration prepay_lease_duration = 5;
}

message Alipay {
  string app_id = 1;
  string private_key = 2;
  bool is_production = 3;
  string app_cert_path = 4;
  string alipay_public_cert_path = 5;
  string alipay_root_cert_path = 6;
  bool enabled = 7;
}

message Wechat {
  string app_id = 1;
  string mch_id = 2;
  string api_key = 3;
  bool is_production = 4;
  bool enabled = 5;
}

message CheckPayJob {
  // 首次延迟多久开始轮询。
  google.protobuf.Duration initial_delay = 1;
  // 最大轮询次数。
  int32 max_polls = 2;
  // 每次轮询间隔。
  google.protobuf.Duration poll_interval = 3;
}

message Community {
  int32 history_retention_days = 1;
  int32 cleanup_batch_size = 2;
  int32 maintenance_workers = 3;
  int32 media_workers = 4;
  int32 posts_per_minute = 5;
  int32 comments_per_minute = 6;
  int32 uploads_per_minute = 7;
  int32 interactions_per_minute = 8;
  bool rate_limit_fail_open = 9;
}
message Storage {
  string provider = 1;
  string endpoint = 2;
  string public_endpoint = 3;
  string bucket = 4;
  string region = 5;
  string access_key_env = 6;
  string secret_key_env = 7;
  bool use_tls = 8;
  bool public_use_tls = 9;
  int32 upload_ttl_seconds = 10;
  int32 read_ttl_seconds = 11;
  int32 unused_retention_hours = 12;
  // Explicit opt-out of the TLS requirement. Only for local development with
  // a plaintext MinIO: with it false, use_tls/public_use_tls must be true or
  // startup fails, because static credentials and presigned URLs would travel
  // in cleartext.
  bool allow_insecure = 13;
}
