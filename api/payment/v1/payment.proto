syntax = "proto3";

package api.payment.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Dailiduzhou/simple-ecommerce/api/payment/v1;v1";
option java_multiple_files = true;
option java_package = "api.payment.v1";

// 支付渠道枚举。
// 服务端负责把枚举值映射到内部 biz.PayChannel(wechat/alipay)并从 extra_params
// 中抽取渠道特有的字段(如 WECHAT_JSAPI 需要的 openid)。
enum PayChannel {
  PAY_CHANNEL_UNSPECIFIED  = 0;
  PAY_CHANNEL_ALIPAY_WAP   = 1;  // 支付宝手机网站支付
  PAY_CHANNEL_ALIPAY_APP   = 2;  // 支付宝 APP 支付
  PAY_CHANNEL_WECHAT_JSAPI = 3;  // 微信 JSAPI(小程序/公众号)
  PAY_CHANNEL_WECHAT_NATIVE = 4; // 微信 NATIVE(扫码)
  PAY_CHANNEL_WECHAT_APP   = 5;  // 微信 APP 支付
}

// 支付服务。
// 原 WechatPayService / AliPayService 已经被收编到本 service,前端只需
// 通过 channel 字段路由到具体渠道,不再为不同渠道调用不同的 RPC。
service Payment {
  // 统一创建支付:取订单 → 建支付流水 → 调三方 → 返回前端动作。
  // 同时取代了旧 Payment.CreatePayment(写流水) + WechatPayService.PrepayJSAPI
  // + AliPayService.Prepay 三个 RPC。
  rpc CreatePayment(CreatePaymentReq) returns (CreatePaymentReply) {
    option (google.api.http) = {
      post: "/v1/payments"
      body: "*"
    };
  }

  // 统一查询订单(原 WechatPayService.QueryOrder + AliPayService.QueryOrder)。
  rpc QueryPayment(QueryPaymentReq) returns (QueryPaymentReply) {
    option (google.api.http) = {
      get: "/v1/payments/lookup"
    };
  }

  // 统一关闭订单(原 WechatPayService.CloseOrder + AliPayService.CloseOrder)。
  rpc ClosePayment(ClosePaymentReq) returns (ClosePaymentReply) {
    option (google.api.http) = {
      post: "/v1/payments/lookup/close"
      body: "*"
    };
  }

  // —— 以下 RPC 不在本次渠道统一重构范围,保留不动 ——
  rpc GetPayment(GetPaymentRequest) returns (PaymentInfo) {
    option (google.api.http) = {get: "/v1/payments/{id}"};
  }
  rpc GetPaymentByOrder(GetPaymentByOrderRequest) returns (PaymentInfo) {
    option (google.api.http) = {get: "/v1/orders/{order_id}/payment"};
  }
  rpc RefundPayment(RefundPaymentRequest) returns (RefundPaymentReply) {
    option (google.api.http) = {
      post: "/v1/payments/{id}/refund"
      body: "*"
    };
  }
  rpc CreateWechatPayCheckJob(CreateWechatPayCheckJobRequest) returns (MQJobInfo) {
    option (google.api.http) = {
      post: "/v1/pay/wechat/checks"
      body: "*"
    };
  }
  rpc GetMQJob(GetMQJobRequest) returns (MQJobInfo) {
    option (google.api.http) = {get: "/v1/payments/mq/jobs/{job_id}"};
  }
}

// 统一创建支付请求。
// - order_no: 商户订单号(对应 orders.out_trade_no)。
// - channel: 支付渠道枚举。
// - client_ip: 客户端 IP,微信风控必传。
// - extra_params: 渠道特有的扩展参数抹平字段:
//     * WECHAT_JSAPI 必须传 "openid"。
//     * ALIPAY_WAP 可传 "return_url"。
// - description / total_amount: 可选;省略时服务端从订单商品和金额兜底。
message CreatePaymentReq {
  string order_no = 1;
  PayChannel channel = 2;
  string client_ip = 3;
  map<string, string> extra_params = 4;
  string description = 5;
  int32 total_amount = 6;
}

// 统一创建支付响应。
// - action_type: 告诉前端该怎么处理 payload。
//     * "FORM_SUBMIT"  — 支付宝表单,前端把 payload 渲染到 <form> 提交。
//     * "URL_REDIRECT" — 直接跳转链接,前端 location.href = payload。
//     * "WECHAT_INVOKE" — 唤起微信 JSAPI,前端用 WeixinJSBridge / jweixin 触发。
// - payload: 渠道真实的支付参数,序列化为 JSON 字符串,字段契约见 service 注释。
message CreatePaymentReply {
  string action_type = 1;
  string payload = 2;
}

message QueryPaymentReq {
  string out_trade_no = 1;
  PayChannel channel = 2;
}
message QueryPaymentReply {
  string out_trade_no = 1;
  string transaction_id = 2;
  TradeState trade_state = 3;
  int32 total_amount = 4;
}

message ClosePaymentReq {
  string out_trade_no = 1;
  PayChannel channel = 2;
}
message ClosePaymentReply {
  bool success = 1;
}

message PaymentInfo {
  int64 id = 1;
  int64 order_id = 2;
  int64 user_id = 3;
  int64 merchant_id = 4;
  string amount = 5;
  string status = 6; // pending/success/failed/refunded
  string pay_channel = 7;
  string third_party_tx_id = 8;
  google.protobuf.Timestamp paid_at = 9;
  google.protobuf.Timestamp created_at = 10;
  string out_trade_no = 11;
}

message GetPaymentRequest {
  int64 id = 1;
}

message GetPaymentByOrderRequest {
  int64 order_id = 1;
}

message RefundPaymentRequest {
  int64 id = 1;
}
message RefundPaymentReply {}

message CreateWechatPayCheckJobRequest {
  int64 payment_id = 1;
  int64 order_id = 2;
  string out_trade_no = 3;
  int32 delay_seconds = 4;
  int32 max_polls = 5;
  int32 poll_interval_seconds = 6;
  string source = 7;
}

message GetMQJobRequest {
  int64 job_id = 1;
}

message MQJobInfo {
  int64 job_id = 1;
  string kind = 2;
  string queue = 3;
  string state = 4;
  int32 attempt = 5;
  int32 max_attempts = 6;
  string args_json = 7;
  repeated string tags = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp scheduled_at = 10;
  google.protobuf.Timestamp attempted_at = 11;
  google.protobuf.Timestamp finalized_at = 12;
  repeated MQJobError errors = 13;
}

message MQJobError {
  int32 attempt = 1;
  string error = 2;
  google.protobuf.Timestamp at = 3;
}

enum TradeState {
  TRADE_STATE_UNSPECIFIED = 0;
  SUCCESS = 1; // 支付成功
  REFUND = 2; // 转入退款
  NOTPAY = 3; // 未支付
  CLOSED = 4; // 已关闭
  REVOKED = 5; // 已撤销
  USERPAYING = 6; // 用户支付中
  PAYERROR = 7; // 支付失败
}
