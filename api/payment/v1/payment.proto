syntax = "proto3";

package api.payment.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Dailiduzhou/simple-ecommerce/api/payment/v1;v1";
option java_multiple_files = true;
option java_package = "api.payment.v1";

service Payment {
  rpc CreatePayment (CreatePaymentRequest) returns (PaymentInfo) {
    option (google.api.http) = {
      post: "/v1/payments"
      body: "*"
    };
  }
  rpc GetPayment (GetPaymentRequest) returns (PaymentInfo) {
    option (google.api.http) = {
      get: "/v1/payments/{id}"
    };
  }
  rpc GetPaymentByOrder (GetPaymentByOrderRequest) returns (PaymentInfo) {
    option (google.api.http) = {
      get: "/v1/orders/{order_id}/payment"
    };
  }
  // 第三方支付回调
  rpc NotifyPayment (NotifyPaymentRequest) returns (NotifyPaymentReply) {
    option (google.api.http) = {
      post: "/v1/payments/notify"
      body: "*"
    };
  }
  rpc RefundPayment (RefundPaymentRequest) returns (RefundPaymentReply) {
    option (google.api.http) = {
      post: "/v1/payments/{id}/refund"
      body: "*"
    };
  }
  rpc CreateWechatPayCheckJob (CreateWechatPayCheckJobRequest) returns (MQJobInfo) {
    option (google.api.http) = {
      post: "/v1/pay/wechat/checks"
      body: "*"
    };
  }
  rpc GetMQJob (GetMQJobRequest) returns (MQJobInfo) {
    option (google.api.http) = {
      get: "/v1/payments/mq/jobs/{job_id}"
    };
  }
}

// 微信支付服务
service WechatPayService {
  // JSAPI 统一下单 (小程序/公众号支付)
  rpc PrepayJSAPI (PrepayJSAPIRequest) returns (PrepayJSAPIReply) {
    option (google.api.http) = {
      post: "/v1/pay/wechat/prepay/jsapi"
      body: "*"
    };
  }

  // 查询订单状态
  rpc QueryOrder (QueryOrderRequest) returns (QueryOrderReply) {
    option (google.api.http) = {
      get: "/v1/pay/wechat/order/{out_trade_no}"
    };
  }

  // 关闭订单
  rpc CloseOrder (CloseOrderRequest) returns (CloseOrderReply) {
    option (google.api.http) = {
      post: "/v1/pay/wechat/order/{out_trade_no}/close"
      body: "*"
    };
  }
}

message PaymentInfo {
  int64  id               = 1;
  int64  order_id         = 2;
  int64  user_id          = 3;
  int64  merchant_id      = 4;
  string amount           = 5;
  string status           = 6; // pending/success/failed/refunded
  string pay_channel      = 7;
  string third_party_tx_id = 8;
  google.protobuf.Timestamp paid_at    = 9;
  google.protobuf.Timestamp created_at = 10;
}

message CreatePaymentRequest {
  int64  order_id    = 1;
  int64  user_id     = 2;
  int64  merchant_id = 3;
  string pay_channel = 4; // wechat/alipay
}

message GetPaymentRequest {
  int64 id = 1;
}

message GetPaymentByOrderRequest {
  int64 order_id = 1;
}

message NotifyPaymentRequest {
  string third_party_tx_id = 1;
  string pay_channel       = 2;
  string status            = 3; // success/failed
  int64  payment_id        = 4;
}
message NotifyPaymentReply {
  string result = 1; // "success" 告知第三方已处理
}

message RefundPaymentRequest {
  int64 id = 1;
}
message RefundPaymentReply {}

message CreateWechatPayCheckJobRequest {
  int64  payment_id            = 1;
  int64  order_id              = 2;
  string out_trade_no          = 3;
  int32  delay_seconds         = 4;
  int32  max_polls             = 5;
  int32  poll_interval_seconds = 6;
  string source                = 7;
}

message GetMQJobRequest {
  int64 job_id = 1;
}

message MQJobInfo {
  int64  job_id       = 1;
  string kind         = 2;
  string queue        = 3;
  string state        = 4;
  int32  attempt      = 5;
  int32  max_attempts = 6;
  string args_json    = 7;
  repeated string tags = 8;
  google.protobuf.Timestamp created_at   = 9;
  google.protobuf.Timestamp scheduled_at = 10;
  google.protobuf.Timestamp attempted_at = 11;
  google.protobuf.Timestamp finalized_at = 12;
  repeated MQJobError errors = 13;
}

message MQJobError {
  int32 attempt = 1;
  string error  = 2;
  google.protobuf.Timestamp at = 3;
}

// 微信支付交易状态枚举
enum TradeState {
  TRADE_STATE_UNSPECIFIED = 0;
  SUCCESS = 1;       // 支付成功
  REFUND = 2;        // 转入退款
  NOTPAY = 3;        // 未支付
  CLOSED = 4;        // 已关闭
  REVOKED = 5;       // 已撤销
  USERPAYING = 6;    // 用户支付中
  PAYERROR = 7;      // 支付失败
}

// JSAPI 统一下单请求
message PrepayJSAPIRequest {
  string out_trade_no = 1; // 商户订单号
  string description  = 2; // 商品描述
  int32  total_amount = 3; // 订单总金额，单位为分
  string openid       = 4; // 用户在商户 appid 下的唯一标识
}

// JSAPI 统一下单响应 (返回给前端唤起微信支付的核心参数)
message PrepayJSAPIReply {
  string app_id          = 1; // 应用ID
  string time_stamp      = 2; // 时间戳
  string nonce_str       = 3; // 随机字符串
  string prepay_package  = 4 [json_name = "package"]; // 订单详情扩展字符串 (如 prepay_id=xxx)
  string sign_type       = 5; // 签名方式 (通常是 RSA)
  string pay_sign        = 6; // 签名
}

// 查询订单请求
message QueryOrderRequest {
  string out_trade_no = 1; // 商户订单号
}

// 查询订单响应
message QueryOrderReply {
  string out_trade_no    = 1; // 商户订单号
  string transaction_id  = 2; // 微信支付系统生成的订单号
  TradeState trade_state = 3; // 交易状态
  int32  total_amount    = 4; // 订单总金额，单位为分
}

// 关闭订单请求
message CloseOrderRequest {
  string out_trade_no = 1; // 商户订单号
}

// 关闭订单响应
message CloseOrderReply {
  bool success = 1; // 是否关闭成功
}
