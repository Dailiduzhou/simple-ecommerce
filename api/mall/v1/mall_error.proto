syntax = "proto3";

package api.mall.v1;

import "errors/errors.proto";

option go_package = "github.com/Dailiduzhou/simple-ecommerce/api/mall/v1;v1";
option java_multiple_files = true;
option java_package = "api.mall.v1";

enum ErrorReason {
  option (errors.default_code) = 500;

  PRODUCT_NOT_FOUND     = 0 [(errors.code) = 404];
  CATEGORY_NOT_FOUND    = 1 [(errors.code) = 404];
  EVENT_NOT_FOUND       = 2 [(errors.code) = 404];
  EVENT_INVALID_WINDOW  = 7 [(errors.code) = 400];
  INSUFFICIENT_STOCK    = 3 [(errors.code) = 409];
  PRODUCT_STATUS_INVALID = 4 [(errors.code) = 400];
  CATEGORY_HAS_PRODUCTS = 5 [(errors.code) = 409];
  CATEGORY_HAS_CHILDREN = 8 [(errors.code) = 409];
  PRODUCT_PRICE_INVALID = 9 [(errors.code) = 400];
  PRODUCT_DISCOUNT_INVALID = 10 [(errors.code) = 400];
  PRODUCT_NAME_INVALID = 11 [(errors.code) = 400];
  PRODUCT_STOCK_INVALID = 12 [(errors.code) = 400];
  PRODUCT_INVALID = 13 [(errors.code) = 400];
  SHIPPING_ADDRESS_NOT_FOUND = 6 [(errors.code) = 404];
}
