syntax = "proto3";

package api.order.v1;

import "google/api/annotations.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Dailiduzhou/simple-ecommerce/api/order/v1;v1";
option java_multiple_files = true;
option java_package = "api.order.v1";

service Order {
  rpc CreateOrder (CreateOrderRequest) returns (OrderInfo) {
    option (google.api.http) = {
      post: "/v1/orders"
      body: "*"
    };
  }
  rpc GetOrder (GetOrderRequest) returns (OrderInfo) {
    option (google.api.http) = {
      get: "/v1/orders/{id}"
    };
  }
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersReply) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}/orders"
    };
  }
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderReply) {
    option (google.api.http) = {
      post: "/v1/orders/{id}/cancel"
      body: "*"
    };
  }
}

message OrderItem {
  int64  product_id   = 1;
  string product_name = 2;
  string cover_image  = 3;
  int32  quantity     = 4;
  string unit_price   = 5;
}

message OrderInfo {
  int64  id           = 1;
  int64  user_id      = 2;
  int64  address_id   = 3;
  string total_amount = 4;
  string status       = 5;
  bool   is_completed = 6;
  repeated OrderItem items = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string order_no = 10;
  string currency = 11;
}

message CreateOrderRequest {
  int64 address_id = 1;
  // Bounded because the whole order runs in one transaction that locks every
  // product row it touches.
  repeated OrderItemInput items = 2 [(buf.validate.field).repeated = {min_items: 1, max_items: 50}];
  string idempotency_key = 3 [(buf.validate.field).string = {min_len: 8, max_len: 64}];
}
message OrderItemInput {
  int64 product_id = 1 [(buf.validate.field).int64 = {gt: 0}];
  int32 quantity   = 2 [(buf.validate.field).int32 = {gt: 0, lte: 999}];
}

message GetOrderRequest {
  int64 id      = 1;
  int64 user_id = 2;
}

message ListOrdersRequest {
  int64 user_id    = 1;
  bool  ongoing    = 2; // true 只查未完成
  int32 page_size  = 3;
  int32 page       = 4;
}
message ListOrdersReply {
  repeated OrderInfo orders = 1;
  int32 total               = 2;
}

message CancelOrderRequest {
  int64 id      = 1;
  int64 user_id = 2;
}
message CancelOrderReply {}
