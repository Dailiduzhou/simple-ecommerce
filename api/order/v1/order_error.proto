syntax = "proto3";

package api.order.v1;

import "errors/errors.proto";

option go_package = "github.com/Dailiduzhou/simple-ecommerce/api/order/v1;v1";
option java_multiple_files = true;
option java_package = "api.order.v1";

enum ErrorReason {
  option (errors.default_code) = 500;

  ORDER_NOT_FOUND          = 0 [(errors.code) = 404];
  ORDER_ALREADY_CANCELLED  = 1 [(errors.code) = 409];
  ORDER_CANNOT_CANCEL      = 2 [(errors.code) = 400];
  INSUFFICIENT_STOCK       = 3 [(errors.code) = 409];
  ADDRESS_NOT_FOUND        = 4 [(errors.code) = 404];
  IDEMPOTENCY_KEY_REQUIRED = 5 [(errors.code) = 400];
  IDEMPOTENCY_KEY_INVALID  = 6 [(errors.code) = 400];
  IDEMPOTENCY_KEY_CONFLICT = 7 [(errors.code) = 409];
  ORDER_EXPIRED            = 8 [(errors.code) = 409];
}
