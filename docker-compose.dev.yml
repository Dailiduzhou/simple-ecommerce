services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [storage]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'test -n "$${MINIO_ROOT_USER}" && test -n "$${MINIO_ROOT_PASSWORD}" || { echo "Set separate MinIO administrator credentials" >&2; exit 1; }; exec minio server /data --console-address :9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - minio_data:/data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      # Local development only; the production compose file requires a real value.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # Optional local password: set REDIS_PASSWORD to exercise the authenticated path.
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server; fi"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - jaeger
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "9464:9464"

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      - otel-collector
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/payment-alerts.yaml:/etc/prometheus/payment-alerts.yaml:ro
      - ./deploy/community-alerts.yaml:/etc/prometheus/community-alerts.yaml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:2.9.0
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    volumes:
      - ./deploy/promtail.yaml:/etc/promtail/config.yaml:ro
      - mall_logs:/logs/mall:ro

  grafana:
    image: grafana/grafana:10.2.0
    depends_on:
      - loki
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboard-definitions:/var/lib/grafana/dashboards:ro

  mall:
    build:
      context: .
      dockerfile: app/mall/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
      otel-collector:
        condition: service_started
      loki:
        condition: service_started
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_SOURCE: ${DATABASE_SOURCE:-postgres://postgres:postgres@postgres:5432/ecommerce?sslmode=disable}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_MIGRATION_SOURCE: ${DATABASE_MIGRATION_SOURCE:-}
      DATABASE_DISABLE_MIGRATIONS: ${DATABASE_DISABLE_MIGRATIONS:-false}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?set AUTH_ACCESS_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET:?set AUTH_REFRESH_TOKEN_SECRET}
      AUTH_PHONE_SECRET: ${AUTH_PHONE_SECRET:?set AUTH_PHONE_SECRET}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-disabled}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-minio:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-localhost:9002}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-ecommerce-images}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_USE_TLS: ${STORAGE_USE_TLS:-false}
      STORAGE_PUBLIC_USE_TLS: ${STORAGE_PUBLIC_USE_TLS:-false}
      STORAGE_ALLOW_INSECURE: ${STORAGE_ALLOW_INSECURE:-true}
      SNOWFLAKE_NODE_ID: ${SNOWFLAKE_NODE_ID:-1}
      PAYMENT_CALLBACK_BASE_URL: ${PAYMENT_CALLBACK_BASE_URL:-}
      PAYMENT_ALIPAY_ENABLED: ${PAYMENT_ALIPAY_ENABLED:-false}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_IS_PRODUCTION: ${ALIPAY_IS_PRODUCTION:-false}
      ALIPAY_APP_CERT_PATH: /data/certs/appPublicCert.crt
      ALIPAY_PUBLIC_KEY_PATH: /data/certs/alipayPublicCert.crt
      ALIPAY_ROOT_KEY_PATH: /data/certs/alipayRootCert.crt
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      PAYMENT_WECHAT_ENABLED: ${PAYMENT_WECHAT_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_API_KEY: ${WECHAT_API_KEY:-}
      WECHAT_IS_PRODUCTION: ${WECHAT_IS_PRODUCTION:-false}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL:-}
    volumes:
      - ./app/mall/configs:/data/conf:ro
      - ./app/mall/configs/certs:/data/certs:ro
      - mall_logs:/app/logs
    ports:
      - "8000:8000"
      - "9000:9000"

volumes:
  minio_data:
  grafana_data:
  loki_data:
  mall_logs:
  postgres_data:
