name: Test and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce_integration
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U integration -d ecommerce_integration"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ECOMMERCE_INTEGRATION_EXCLUSIVE: "true"
      ECOMMERCE_INTEGRATION_POSTGRES_URL: postgres://integration:integration-only@127.0.0.1:5432/ecommerce_integration?sslmode=disable
      ECOMMERCE_INTEGRATION_REDIS_ADDR: 127.0.0.1:6379
      ECOMMERCE_INTEGRATION_S3_ENDPOINT: 127.0.0.1:19000
      ECOMMERCE_INTEGRATION_S3_BUCKET: ecommerce-integration
      # Ephemeral local CI credentials, never production credentials.
      ECOMMERCE_INTEGRATION_S3_ACCESS_KEY: integration-only
      ECOMMERCE_INTEGRATION_S3_SECRET_KEY: integration-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # MinIO community images are no longer publicly available. Build the
      # pinned official source release instead, and cache the build across jobs.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build isolated MinIO image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/minio.Dockerfile
          load: true
          tags: ecommerce-minio:local
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio
      - name: Start isolated MinIO
        run: |
          docker run -d --name ecommerce-integration-minio \
            -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER="$ECOMMERCE_INTEGRATION_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$ECOMMERCE_INTEGRATION_S3_SECRET_KEY" \
            ecommerce-minio:local server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/ready; then exit 0; fi
            sleep 2
          done
          echo 'MinIO did not become ready' >&2
          docker logs ecommerce-integration-minio
          exit 1
      - name: Required real integration tests (no missing-env skips)
        run: bash .github/scripts/integration-test.sh
      - name: Remove job-owned MinIO
        if: always()
        run: |
          if docker container inspect ecommerce-integration-minio >/dev/null 2>&1; then
            docker rm -f ecommerce-integration-minio
          fi

  deployment-config:
    name: Validate Caddy deployment configuration
    runs-on: ubuntu-latest
    env:
      MALL_IMAGE: registry.example.com/example/aiyoung@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      MINIO_IMAGE: registry.example.com/example/aiyoung@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      POSTGRES_PASSWORD: ci-config-only
      REDIS_PASSWORD: ci-config-only
      GRAFANA_ADMIN_PASSWORD: ci-config-only
      AUTH_ACCESS_TOKEN_SECRET: ci-config-access-not-a-runtime-secret
      AUTH_REFRESH_TOKEN_SECRET: ci-config-refresh-not-a-runtime-secret
      AUTH_PHONE_SECRET: ci-config-phone-not-a-runtime-secret
      MINIO_ROOT_USER: ci-config-admin
      MINIO_ROOT_PASSWORD: ci-config-admin-not-a-runtime-secret
      STORAGE_ACCESS_KEY: ci-config-app
      STORAGE_SECRET_KEY: ci-config-app-not-a-runtime-secret
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and merged Compose (no runtime secrets)
        run: |
          bash -n .github/scripts/deploy-test.sh .github/scripts/image-metadata.sh deploy/deploy-test.sh
          docker compose --env-file deploy/test.env.example \
            -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.caddy.yml \
            config --quiet
      - name: Validate Caddy using the deployed image
        run: |
          docker compose --env-file deploy/test.env.example \
            -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.caddy.yml \
            run --rm --no-deps caddy-check caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test actual Caddy routing without public listeners or ACME
        run: |
          image="$(docker compose --env-file deploy/test.env.example \
            -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.caddy.yml \
            config --images caddy)"
          container="$(docker create "$image")"
          trap 'docker rm -v "$container" >/dev/null' EXIT
          docker cp "$container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          chmod +x "$RUNNER_TEMP/caddy"
          PATH="$RUNNER_TEMP:$PATH" go test ./deploy -run '^TestCaddy' -count=1

  deploy-test:
    name: Publish and deploy behind Caddy
    needs: [test, integration, deployment-config]
    # This repository variable is an explicit opt-in. PRs never deploy or receive
    # deployment credentials; manual runs must also target the default branch.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.TEST_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: testing
    concurrency:
      group: deploy-testing
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Refuse an outdated deployment
        run: |
          latest_sha="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo 'A newer default-branch revision exists; deploy its workflow instead.' >&2
            exit 1
          fi
      - name: Set shared ACR repository and commit-suffix tags
        id: image
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE || vars.NAMESPACE }}
        run: bash .github/scripts/image-metadata.sh
      # The test server is linux/amd64 only. Do not re-add QEMU or extra
      # platforms: deploy/minio.Dockerfile compiles MinIO from source in its
      # build stage, so a foreign architecture would run the whole Go toolchain
      # under emulation and can exhaust the job timeout.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and publish mall
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/mall/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.mall_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mall
          cache-to: type=gha,mode=max,scope=mall
      - name: Build and publish MinIO to the same repository
        id: minio
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/minio.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.minio_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=minio-release
          cache-to: type=gha,mode=max,scope=minio-release
      # Tags are human-readable commit suffixes; deploy BOTH exact build digests.
      # MinIO data, runtime credentials and frontend artifacts stay on the server.
      - name: Deploy immutable images and Caddy configuration over SSH
        env:
          MALL_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          MINIO_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.minio.outputs.digest }}
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
          TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          TEST_SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
          TEST_SSH_PORT: ${{ vars.TEST_SSH_PORT || '22' }}
          TEST_DEPLOY_PATH: ${{ vars.TEST_DEPLOY_PATH || '/opt/simple-ecommerce-test' }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/scripts/deploy-test.sh
