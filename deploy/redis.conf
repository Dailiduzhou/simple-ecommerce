# Bound data below the 128 MiB container cap, leaving headroom for allocator
# fragmentation, client buffers and persistence overhead. maxmemory is not
# an RSS limit; revalidate both budgets when changing the workload or cap.
maxmemory 64mb

# Sessions, refresh-token replay markers and rate-limit state share this Redis
# with ordinary caches. Never silently evict security state under pressure:
# reject memory-growing writes instead (cache writes are already best-effort).
maxmemory-policy noeviction
