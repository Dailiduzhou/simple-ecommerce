server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: mall
    static_configs:
      - targets: [localhost]
        labels:
          job: mall
          service: mall
          __path__: /logs/mall/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            caller: caller
            message: msg
            service_name: '"service.name"'
            trace_id: '"trace.id"'
      - labels:
          level:
          service_name:
