services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # Authenticate the cache that holds the jwt blacklist and limiter budgets:
    # an unauthenticated Redis lets anyone with network access clear them.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    # Self-hosted object storage for this deployment. The S3 endpoint must be
    # reachable by clients because the API hands out presigned upload URLs, so
    # it is the one private service that is not loopback-bound; the console
    # stays on loopback. Enable with --profile storage.
    #
    # Upstream only publishes the moving `latest` tag (versioned release tags
    # are gone), so pin the digest that matches RELEASE.2025-09-07T16-13-09Z.
    # Building a specific release from source is what deploy/minio.Dockerfile is
    # for; that needs a Go toolchain and is not required here.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [storage]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'test -n "$${MINIO_ROOT_USER}" && test -n "$${MINIO_ROOT_PASSWORD}" || { echo "Set separate MinIO administrator credentials" >&2; exit 1; }; exec minio server /data --console-address :9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - minio_data:/data

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    # Monitoring UIs have no built-in authentication: publish them on the
    # loopback interface only. Remote access should go through an
    # authenticating reverse proxy, never the published port.
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - jaeger
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:14317:4317"
      - "127.0.0.1:9464:9464"

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      - otel-collector
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/payment-alerts.yaml:/etc/prometheus/payment-alerts.yaml:ro
      - ./deploy/community-alerts.yaml:/etc/prometheus/community-alerts.yaml:ro
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:2.9.0
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    volumes:
      - ./deploy/promtail.yaml:/etc/promtail/config.yaml:ro
      - mall_logs:/logs/mall:ro

  grafana:
    image: grafana/grafana:10.2.0
    depends_on:
      - loki
    environment:
      # No anonymous organization admin: anyone who can reach the published
      # port would otherwise own the Grafana org, its datasources and every
      # dashboard. Real users authenticate with the provisioned admin account.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboard-definitions:/var/lib/grafana/dashboards:ro

  mall:
    image: dailiduzhou/mall:1.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
      otel-collector:
        condition: service_started
      loki:
        condition: service_started
    environment:
      APP_IS_PRODUCTION: "true" # Production compose cannot enable development CORS.
      HTTP_CORS_ALLOWED_ORIGINS: ${HTTP_CORS_ALLOWED_ORIGINS:-}
      HTTP_CORS_ALLOW_CREDENTIALS: ${HTTP_CORS_ALLOW_CREDENTIALS:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      DATABASE_SOURCE: ${DATABASE_SOURCE:?set DATABASE_SOURCE (use sslmode=require outside a trusted network)}
      DATABASE_MIGRATION_SOURCE: ${DATABASE_MIGRATION_SOURCE:-}
      DATABASE_DISABLE_MIGRATIONS: ${DATABASE_DISABLE_MIGRATIONS:-false}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?set AUTH_ACCESS_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET:?set AUTH_REFRESH_TOKEN_SECRET}
      AUTH_PHONE_SECRET: ${AUTH_PHONE_SECRET:?set AUTH_PHONE_SECRET}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-disabled}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-ecommerce-images}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_USE_TLS: "true"
      STORAGE_PUBLIC_USE_TLS: "true"
      STORAGE_ALLOW_INSECURE: "false"
      SNOWFLAKE_NODE_ID: ${SNOWFLAKE_NODE_ID:-1}
      PAYMENT_CALLBACK_BASE_URL: ${PAYMENT_CALLBACK_BASE_URL:-}
      PAYMENT_ALIPAY_ENABLED: ${PAYMENT_ALIPAY_ENABLED:-false}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_IS_PRODUCTION: ${ALIPAY_IS_PRODUCTION:-false}
      ALIPAY_APP_CERT_PATH: /data/certs/appPublicCert.crt
      ALIPAY_PUBLIC_KEY_PATH: /data/certs/alipayPublicCert.crt
      ALIPAY_ROOT_KEY_PATH: /data/certs/alipayRootCert.crt
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      PAYMENT_WECHAT_ENABLED: ${PAYMENT_WECHAT_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_API_KEY: ${WECHAT_API_KEY:-}
      WECHAT_IS_PRODUCTION: ${WECHAT_IS_PRODUCTION:-false}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL:-}
    volumes:
      - ./app/mall/configs:/data/conf:ro
      - ./app/mall/configs/certs:/data/certs:ro
      - mall_logs:/app/logs
    ports:
      - "8000:8000"
      - "127.0.0.1:9000:9000"

volumes:
  grafana_data:
  loki_data:
  mall_logs:
  postgres_data:
  minio_data:
