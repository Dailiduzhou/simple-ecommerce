services:
  # Sized for the 2-core/4 GB test server: declared caps total ~2.5 GB
  # (~3 GB with the optional MinIO overlay), deliberately leaving >= 1 GB
  # for the kernel, dockerd, page cache and bursts. Caps are headroom over
  # idle usage, not tight sizing: postgres can spike far above baseline during
  # migrations, and the Go service under load.
  # mem_limit is the Compose v2 spelling of the cgroup memory cap (docker run
  # --memory); it needs no deploy: section or swarm-mode interpretation.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Shared buffers stay a fixed fraction of the 384 MB cap; no tuning needed.
    mem_limit: 384m
    # Oversubscribed workloads (migrations on small hosts, batch jobs, e.g. the
    # community history cleanup) can transiently exceed the RAM cap.
    # memswap_limit > mem_limit gives postgres 128 MB of swap headroom instead
    # of an immediate OOM kill; the kernel still caps RAM+swap combined at 512m.
    # Set it equal to mem_limit to disable swap entirely.
    memswap_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # Authenticate the cache that holds the jwt blacklist and limiter budgets:
    # an unauthenticated Redis lets anyone with network access clear them.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    ports:
      - "6379:6379"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # all-in-one keeps spans in memory; sampling controls the inflow but the
      # store still grows with traffic. Cap it so a burst cannot exhaust the
      # container/host: oldest traces are evicted once the limit is reached.
      # 20000 traces keeps the store comfortably inside the 256 MB cap.
      MEMORY_MAX_TRACES: "20000"
    # Monitoring UIs have no built-in authentication: publish them on the
    # loopback interface only. Remote access should go through an
    # authenticating reverse proxy, never the published port.
    mem_limit: 256m
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - jaeger
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    mem_limit: 128m
    ports:
      - "127.0.0.1:14317:4317"
      - "127.0.0.1:9464:9464"

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      - otel-collector
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/payment-alerts.yaml:/etc/prometheus/payment-alerts.yaml:ro
      - ./deploy/community-alerts.yaml:/etc/prometheus/community-alerts.yaml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Match the alerting window already used by the rule files and drop
      # stale timeseries after 15 days so the volume cannot grow unbounded.
      - --storage.tsdb.retention.time=15d
    mem_limit: 256m
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:2.9.0
    # The stock local-config keeps every log forever. Ship our own config so
    # the compactor enforces a retention window (see limits_config below).
    command: -config.file=/etc/loki/config.yaml
    mem_limit: 256m
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
      - ./deploy/loki-config.yaml:/etc/loki/config.yaml:ro

  promtail:
    image: grafana/promtail:2.9.0
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    mem_limit: 128m
    volumes:
      - ./deploy/promtail.yaml:/etc/promtail/config.yaml:ro
      - mall_logs:/logs/mall:ro

  grafana:
    image: grafana/grafana:10.2.0
    depends_on:
      - loki
    environment:
      # No anonymous organization admin: anyone who can reach the published
      # port would otherwise own the Grafana org, its datasources and every
      # dashboard. Real users authenticate with the provisioned admin account.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    mem_limit: 256m
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboard-definitions:/var/lib/grafana/dashboards:ro

  mall:
    image: ${MALL_IMAGE:-dailiduzhou/mall:1.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
      otel-collector:
        condition: service_started
      loki:
        condition: service_started
    environment:
      APP_IS_PRODUCTION: ${APP_IS_PRODUCTION:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Standard OTel sampling knobs ( honoured by pkg/trace). Head sampling at
      # 10% keeps Jaeger/collector volume bounded on the small test host while
      # parentbased preserves full traces for any request that was sampled.
      # Raise for local debugging; arg=0..1 is the sampling probability.
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      DATABASE_SOURCE: ${DATABASE_SOURCE:?set DATABASE_SOURCE (use sslmode=require outside a trusted network)}
      DATABASE_MIGRATION_SOURCE: ${DATABASE_MIGRATION_SOURCE:-}
      DATABASE_DISABLE_MIGRATIONS: ${DATABASE_DISABLE_MIGRATIONS:-false}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?set AUTH_ACCESS_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET:?set AUTH_REFRESH_TOKEN_SECRET}
      AUTH_PHONE_SECRET: ${AUTH_PHONE_SECRET:?set AUTH_PHONE_SECRET}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-disabled}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-minio:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-localhost:9002}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-ecommerce-images}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_USE_TLS: ${STORAGE_USE_TLS:-false}
      STORAGE_PUBLIC_USE_TLS: ${STORAGE_PUBLIC_USE_TLS:-false}
      STORAGE_ALLOW_INSECURE: ${STORAGE_ALLOW_INSECURE:-false}
      SNOWFLAKE_NODE_ID: ${SNOWFLAKE_NODE_ID:-1}
      PAYMENT_CALLBACK_BASE_URL: ${PAYMENT_CALLBACK_BASE_URL:-}
      PAYMENT_ALIPAY_ENABLED: ${PAYMENT_ALIPAY_ENABLED:-false}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_IS_PRODUCTION: ${ALIPAY_IS_PRODUCTION:-false}
      ALIPAY_APP_CERT_PATH: /data/certs/appPublicCert.crt
      ALIPAY_PUBLIC_KEY_PATH: /data/certs/alipayPublicCert.crt
      ALIPAY_ROOT_KEY_PATH: /data/certs/alipayRootCert.crt
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      PAYMENT_WECHAT_ENABLED: ${PAYMENT_WECHAT_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_API_KEY: ${WECHAT_API_KEY:-}
      WECHAT_IS_PRODUCTION: ${WECHAT_IS_PRODUCTION:-false}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL:-}
    mem_limit: 768m
    volumes:
      - ./app/mall/configs:/data/conf:ro
      - ./app/mall/configs/certs:/data/certs:ro
      - mall_logs:/app/logs
    ports:
      - "8000:8000"
      - "9000:9000"

volumes:
  grafana_data:
  loki_data:
  mall_logs:
  postgres_data:
